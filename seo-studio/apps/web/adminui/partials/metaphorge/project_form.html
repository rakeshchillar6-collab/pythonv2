{# adminui/templates/adminui/partials/metaphorge/project_form.html #}
<form
    hx-post="{% url 'adminui:mf-project-create' %}"
    hx-swap="none"
    hx-on::after-request="document.getElementById('modal').classList.add('hidden')"
    class="bg-white rounded-lg p-8 max-w-lg w-full"
>
    {% csrf_token %}
    <h2 class="text-2xl font-semibold mb-6">New Metaphorge Project</h2>

    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Project Name</label>
        <input type="text" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm sm:text-sm">
    </div>

    <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea name="description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm sm:text-sm"></textarea>
    </div>

    <div class="mb-6">
        <label for="depth" class="block text-sm font-medium text-gray-700">Expansion Depth</label>
        <input type="number" name="depth" value="1" min="0" max="5" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm sm:text-sm">
    </div>

    <div class="flex justify-end space-x-4">
        <button type="button"
                class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none"
                onclick="document.getElementById('modal').classList.add('hidden')">
            Cancel
        </button>
        <button type="submit"
                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
            Create Project
        </button>
    </div>
</form>
