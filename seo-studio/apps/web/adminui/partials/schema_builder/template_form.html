{# adminui/templates/adminui/partials/schema_builder/template_form.html #}
{% load htmx_extras %}
<form
    {% if template %}
        hx-post="{% url 'adminui:schema-template-edit' template.id %}"
    {% else %}
        hx-post="{% url 'adminui:schema-template-create' %}"
    {% endif %}
    hx-target="this"
    hx-swap="outerHTML"
    class="bg-white rounded-lg p-8"
>
    {% csrf_token %}
    <h2 class="text-2xl font-semibold mb-6">{% if template %}Edit Schema Template{% else %}New Schema Template{% endif %}</h2>

    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Template Name</label>
        <input type="text" name="name" id="name" value="{{ template.name|default:'' }}" required
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div class="mb-4">
        <label for="schema_type" class="block text-sm font-medium text-gray-700">Schema.org Type</label>
        <input type="text" name="schema_type" id="schema_type" value="{{ template.schema_type|default:'' }}" required
               placeholder="e.g., Article, FAQPage, Product"
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div class="mb-6">
        <label for="template" class="block text-sm font-medium text-gray-700">Template JSON (with Jinja2)</label>
        <textarea name="template" id="template" rows="15" required
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm font-mono">{{ template.template|jsonify|default:'' }}</textarea>
        <p class="mt-2 text-xs text-gray-500">
            Use Jinja2 variables like <code class="bg-gray-100 p-1 rounded">{{ post.title }}</code> or <code class="bg-gray-100 p-1 rounded">{{ site.name }}</code>.
        </p>
    </div>

    <div class="flex justify-end space-x-4">
        <button type="button"
                class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none"
                onclick="document.getElementById('modal').classList.add('hidden')">
            Cancel
        </button>
        <button type="submit"
                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
            Save Template
        </button>
    </div>
</form>
