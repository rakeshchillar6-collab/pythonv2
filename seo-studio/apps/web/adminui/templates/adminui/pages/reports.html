{# adminui/templates/adminui/pages/reports.html #}
{% extends "adminui/base.html" %}

{% block title %}Reports{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-semibold text-gray-800">Reports</h1>
        <button
            hx-get="{% url 'adminui:reports-create' %}"
            hx-target="#modal-content"
            hx-trigger="click"
            onclick="document.getElementById('modal').classList.remove('hidden')"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition duration-200"
        >
            Create New Report
        </button>
    </div>

    <div id="report-list" hx-get="{% url 'adminui:reports-list' %}" hx-trigger="load, reportAdded from:body" hx-swap="innerHTML">
        <!-- Report list will be loaded here by HTMX -->
        <div class="text-center py-8">
            <p class="text-gray-500">Loading reports...</p>
        </div>
    </div>

    <h2 class="text-xl font-semibold text-gray-800 mt-12 mb-4">Recent Report Runs</h2>
    <div id="report-runs" hx-get="{% url 'adminui:reports-runs-list' %}" hx-trigger="load, reportRunStarted from:body" hx-swap="innerHTML">
        <!-- Report runs list will be loaded here -->
        <div class="text-center py-8">
            <p class="text-gray-500">Loading recent runs...</p>
        </div>
    </div>
</div>
{% endblock %}
