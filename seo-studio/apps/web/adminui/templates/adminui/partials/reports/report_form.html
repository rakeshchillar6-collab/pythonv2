{# adminui/templates/adminui/partials/reports/report_form.html #}
<form
    hx-post="{% if report %}{% url 'adminui:reports-edit' report.id %}{% else %}{% url 'adminui:reports-create' %}{% endif %}"
    hx-target="this"
    hx-swap="outerHTML"
    class="bg-white rounded-lg p-8"
>
    {% csrf_token %}
    <h2 class="text-2xl font-semibold mb-6">{% if report %}Edit Report{% else %}Create New Report{% endif %}</h2>

    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700">Report Name</label>
        <input type="text" name="name" id="name" value="{{ report.name|default:'' }}" required
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
    </div>

    <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea name="description" id="description" rows="3"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">{{ report.description|default:'' }}</textarea>
    </div>

    <div class="mb-6">
        <label for="dsl_query" class="block text-sm font-medium text-gray-700">Report Query (DSL)</label>
        <textarea name="dsl_query" id="dsl_query" rows="10" required
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm font-mono">{{ report.dsl_query|default:'' }}</textarea>
        <p class="mt-2 text-xs text-gray-500">
            Example: <code class="bg-gray-100 p-1 rounded">FROM posts SELECT id, title, published_at WHERE created_at > "30d" AND status = "published" ORDER BY published_at DESC LIMIT 100</code>
        </p>
    </div>

    <div class="flex justify-end space-x-4">
        <button type="button"
                class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none"
                onclick="document.getElementById('modal').classList.add('hidden')">
            Cancel
        </button>
        <button type="submit"
                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
            Save Report
        </button>
    </div>
</form>
