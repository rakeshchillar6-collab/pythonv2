[tool.poetry]
name = "seo-studio-web"
version = "0.1.0"
description = "Django backend for SEO Studio"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
djangorestframework = "^3.15"
djangorestframework-simplejwt = "^5.3.1"
psycopg2-binary = "^2.9.9"
django-cors-headers = "^4.3.1"
gunicorn = "^22.0.0"
celery = "^5.4.0"
redis = "^5.0.4"
django-filter = "^24.2"
django-htmx = "^1.17.2"
django-environ = "^0.11.2"
drf-spectacular = "^0.27.2"

# pgvector dependency - use the appropriate one
# For psycopg2
pgvector = "^0.2.1"
# For psycopg3 (if you switch)
# psycopg = { extras = ["binary"], version = "^3.1.18" }


[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-django = "^4.8.0"
coverage = "^7.5.1"
black = "^24.4.2"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
