<!-- templates/adminui/category_list.html -->
{% extends "adminui/base.html" %}

{% block title %}مدیریت دسته‌بندی‌ها{% endblock %}

{% block breadcrumb %}
<a href="{% url 'adminui:dashboard' %}">داشبورد</a> /
<span class="font-semibold">دسته‌بندی‌ها</span>
{% endblock %}

{% block content %}
<div class="container mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">مدیریت دسته‌بندی‌ها</h1>
        <button
            hx-get="{% url 'adminui:category_create' %}"
            hx-target="#modal-content"
            hx-swap="innerHTML"
            onclick="document.getElementById('modal').classList.remove('hidden')"
            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
        >
            ایجاد دسته‌بندی جدید
        </button>
    </div>

    <div id="category-table" class="bg-white p-6 rounded-lg shadow-md">
        {% include 'adminui/partials/category_table.html' %}
    </div>
</div>

<!-- Modal container -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div id="modal-content" class="bg-white rounded-lg shadow-lg w-1/3">
        <!-- Form will be loaded here by HTMX -->
    </div>
</div>
{% endblock %}
