<!-- templates/adminui/partials/category_form.html -->
<form
    {% if category %}
        hx-post="{% url 'adminui:category_update' category.id %}"
    {% else %}
        hx-post="{% url 'adminui:category_create' %}"
    {% endif %}
    hx-target="#category-table"
    hx-swap="outerHTML"
    class="p-6"
    _="on htmx:afterOnLoad target.closest('#modal').classList.add('hidden')"
>
    {% csrf_token %}
    <h2 class="text-2xl font-bold mb-4">{% if category %}ویرایش{% else %}ایجاد{% endif %} دسته‌بندی</h2>

    <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700">نام</label>
        <input type="text" name="name" id="name" value="{{ form.name.value|default:'' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        {% if form.name.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.name.errors|first }}</p>
        {% endif %}
    </div>

    <div class="mb-4">
        <label for="slug" class="block text-sm font-medium text-gray-700">اسلاگ</label>
        <input type="text" name="slug" id="slug" value="{{ form.slug.value|default:'' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
         {% if form.slug.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.slug.errors|first }}</p>
        {% endif %}
    </div>

    <!-- Add other fields like description, parent here if needed -->

    <div class="flex justify-end mt-6">
        <button type="button" onclick="this.closest('#modal').classList.add('hidden')" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg mr-2 hover:bg-gray-400">
            انصراف
        </button>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
            ذخیره
        </button>
    </div>
</form>
