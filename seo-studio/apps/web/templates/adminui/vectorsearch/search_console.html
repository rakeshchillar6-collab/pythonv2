<!-- templates/adminui/vectorsearch/search_console.html -->
{% extends "adminui/base.html" %}

{% block title %}کنسول جستجوی معنایی{% endblock %}

{% block content %}
<div class="container mx-auto">
    <h1 class="text-3xl font-bold mb-6">کنسول جستجوی معنایی</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Search Form Column -->
        <div class="md:col-span-1 bg-white p-6 rounded-lg shadow-md h-fit">
            <form
                hx-post="#" {# URL to the search handler view #}
                hx-target="#search-results-container"
                hx-swap="innerHTML"
                hx-indicator="#search-spinner"
            >
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label for="query" class="block text-sm font-medium text-gray-700">عبارت جستجو</label>
                        <textarea name="query" id="query" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" required></textarea>
                    </div>

                    <div>
                        <label for="mode" class="block text-sm font-medium text-gray-700">حالت جستجو</label>
                        <select name="mode" id="mode" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <option value="hybrid">Hybrid</option>
                            <option value="vector">Vector Only</option>
                            <option value="bm25">BM25 Only</option>
                        </select>
                    </div>

                    <div>
                        <label for="top_k" class="block text-sm font-medium text-gray-700">تعداد نتایج (Top K)</label>
                        <input type="number" name="top_k" id="top_k" value="10" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    </div>

                    <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 flex items-center justify-center">
                        <span id="search-spinner" class="htmx-indicator animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>
                        جستجو
                    </button>
                </div>
            </form>
        </div>

        <!-- Search Results Column -->
        <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">نتایج</h2>
            <div id="search-results-container">
                <p class="text-gray-500">نتایج جستجو در اینجا نمایش داده خواهند شد.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
